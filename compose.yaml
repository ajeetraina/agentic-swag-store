services:
  demo-client:
    image: node:lts-slim
    working_dir: /usr/local/app
    command: yarn dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api:3000
    volumes:
      - ./dev/webapp:/usr/local/app
    depends_on:
      - api

  api:
    build:
      context: .
      target: dev
    command: yarn dev-container
    ports:
      - "3000:3000"
    environment:
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://aws:4566
      INVENTORY_SERVICE_BASE_URL: http://mock-inventory:8080
      PGUSER: postgres
      PGPASSWORD: postgres
      PGHOST: postgres
      PGDATABASE: catalog
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
    volumes:
      - ./src:/usr/local/app/src
    depends_on:
      postgres:
        condition: service_healthy
      aws:
        condition: service_started
      mock-inventory:
        condition: service_started
      kafka:
        condition: service_started

  postgres:
    image: postgres:17.9
    ports:
      - "5432:5432"
    volumes:
      - ./dev/db:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: catalog
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d catalog"]
      interval: 3s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9.14.0
    ports:
      - "5050:80"
    configs:
      - source: pgadmin-pgpass
        target: /config/pgpass
        uid: "5050"
        gid: "5050"
        mode: 0400
      - source: pgadmin-servers
        target: /pgadmin4/servers.json
        mode: 0444
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@mycomp.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    depends_on:
      postgres:
        condition: service_healthy

  aws:
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    post_start:
      - command: awslocal s3api create-bucket --bucket product-images

  mock-inventory:
    image: wiremock/wiremock:3.12.1
    ports:
      - "8090:8080"
    volumes:
      - ./dev/inventory-mocks:/home/wiremock:ro

  kafka:
    image: apache/kafka:4.0.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    post_start:
      - command: /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic products --partitions 1 --replication-factor 1 --bootstrap-server kafka:9093

  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

configs:
  pgadmin-pgpass:
    content: |
      *:*:*:postgres:postgres
  pgadmin-servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "Sandbox Postgres",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "postgres",
            "Username": "postgres",
            "PassFile": "/config/pgpass"
          }
        }
      }
